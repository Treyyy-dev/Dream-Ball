<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dream Ball</title>
<meta name="description" content="Build a 3D basketball squad, train them in your weight room, pull banners for players, cards and shoes, and play a story-mode season.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12152c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dream Ball">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Teko:wght@500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: locked portrait column. Home = top bar, 3D practice gym, bottom nav (Team, Story, PVP, Packs). Match = scoreboard, overhead 3D court, stamina + 4 move cards + Pass/Shoot. Single arena-night look. */
:root{
  --arena:#12152c; --panel:#1c2146; --panel2:#252b58; --rule:#343a6d; --ink:#f5efe4; --muted:#9ea4cf;
  --gold:#ffc94d; --gold-d:#9a6a00; --good:#5fd38a; --bad:#e2453a;
  --team:#e2453a; --team-d:#7d1b14; --team-ink:#fffaf2;
  --r0:#9aa3b5; --r1:#3d8bfd; --r2:#b36bff; --r3:#ffc94d;
  --display:'Bungee',Impact,'Arial Black',sans-serif;
  --num:'Teko','Oswald','Arial Narrow',sans-serif;
  --label:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--arena);color:var(--ink);font-family:var(--label);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;font-size:15px}
button{font-family:inherit;color:inherit}
.app{height:100%;width:100%;max-width:min(500px, calc((100vh - 20px) * .6));max-width:min(500px, calc((100dvh - 20px) * .6));
  margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:10px}
.home .board,.home .hud{display:none}
.match .topbar,.match .nav,.match .gymtag{display:none}
.home .autobtn,.home .effbar{display:none}
svg.ic{width:18px;height:18px;flex:none}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.who{display:flex;align-items:center;gap:9px;min-width:0}
.crest{width:34px;height:37px;flex:none;display:block}
.who b{display:block;font-family:var(--display);font-weight:400;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
.wallet{display:flex;gap:6px;flex:none}
.cur{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:4px 10px 4px 6px;font-family:var(--num);font-size:19px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.cur b{font-weight:600;padding-top:3px}

.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:6px 10px}
.team{display:flex;align-items:center;gap:6px;min-width:0}
.team.away{flex-direction:row-reverse}
.tname{font-family:var(--display);font-size:11px;letter-spacing:.03em;display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap;overflow:hidden}
.tname::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tc);flex:none}
.score{font-family:var(--num);font-weight:600;font-size:38px;line-height:.9;font-variant-numeric:tabular-nums;margin-left:auto;padding-top:4px}
.away .score{margin-left:0;margin-right:auto}
.poss{width:0;height:0;border:6px solid transparent;opacity:0;transition:opacity .2s;flex:none}
.home-t .poss{border-left-color:var(--gold);margin-right:-4px}
.away .poss{border-right-color:var(--gold);margin-left:-4px}
.poss.on{opacity:1}
.mid{text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1}
.period{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.clock{font-family:var(--num);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:3px}
.sc{display:flex;align-items:baseline;gap:5px;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.sc b{font-family:var(--num);font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:2ch}
.sc b.low{color:var(--bad)}

.stage{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;background:#1a1410;border:1px solid var(--rule)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pausebtn{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:10px;border:0;background:rgba(18,21,44,.8);display:flex;align-items:center;justify-content:center;cursor:pointer}
.home .pausebtn{display:none}
.pop{position:absolute;left:0;top:0;font-family:var(--display);white-space:nowrap;will-change:transform,opacity;text-shadow:0 2px 0 rgba(10,12,30,.9),0 0 10px rgba(10,12,30,.6)}
.banner{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);background:rgba(18,21,44,.9);border-block:4px solid var(--bc,var(--gold));text-align:center;padding:14px 10px;pointer-events:none}
.banner h2{font-family:var(--display);font-size:30px;margin:0;font-weight:400;line-height:1.1}
.banner p{margin:6px 0 0;font-size:18px;font-weight:700;color:var(--bc,var(--gold));letter-spacing:.04em}
.glfail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);font-size:16px}

.smeter{position:absolute;left:0;top:0;width:16px;height:92px;border-radius:8px;background:rgba(12,14,30,.82);border:2px solid #f5efe4;overflow:hidden;pointer-events:none}
.smeter .zone{position:absolute;left:0;right:0;background:var(--good);box-shadow:0 0 8px var(--good)}
.smeter .fill{position:absolute;left:2px;right:2px;bottom:2px;background:#fff;border-radius:4px;opacity:.9}
.smeter.res-good{border-color:var(--good)} .smeter.res-ok{border-color:var(--gold)} .smeter.res-bad{border-color:var(--bad)}

.overlay{position:absolute;inset:0;background:rgba(12,14,30,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.overlay h2{font-family:var(--display);font-weight:400;font-size:40px;margin:0;line-height:1}
.overlay .line{font-size:20px;font-weight:700}
.rewards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.panel{position:absolute;inset:0;background:var(--arena);overflow-y:auto;overscroll-behavior:contain;padding:12px 12px 20px;display:flex;flex-direction:column;gap:12px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.phead h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.xbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--rule);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.subtabs{display:flex;gap:6px;background:var(--panel);border-radius:10px;padding:4px}
.subtabs button{flex:1;border:0;background:transparent;border-radius:7px;padding:8px 4px;font-weight:700;font-size:14px;letter-spacing:.08em;cursor:pointer;color:var(--muted)}
.subtabs button.on{background:var(--panel2);color:var(--ink)}
.sect{display:flex;flex-direction:column;gap:8px}
.sect h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sect h3 em{font-style:normal;color:var(--ink);letter-spacing:.04em;font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:0;line-height:1.35}
.hint.act{color:var(--gold)}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}

.chip{position:relative;border:2px solid var(--rc,var(--r0));background:var(--panel);border-radius:10px;padding:4px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-width:0;text-align:center}
.chip svg.av{width:100%;max-width:56px;aspect-ratio:1;display:block}
.chip .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.1}
.chip .ov{position:absolute;left:4px;top:3px;font-family:var(--num);font-size:17px;font-weight:600;line-height:1}
.chip .ps{position:absolute;right:4px;top:4px;font-size:10px;font-weight:700;color:var(--muted)}
.chip .st{font-size:10px;color:var(--gold);letter-spacing:1px;line-height:1}
.chip.locked{opacity:.38;cursor:default}
.chip.locked svg.av{filter:grayscale(1) brightness(.5)}
.chip.sel{outline:3px solid var(--gold);outline-offset:2px}
.chip .tag{position:absolute;right:3px;bottom:22px;background:var(--gold);color:#2a1d00;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px}

.scard{position:relative;border:2px solid var(--rc,var(--r0));background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:10px;padding:6px 6px 7px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-height:84px;text-align:left}
.scard .cn{font-weight:700;font-size:14px;line-height:1.05}
.scard .cc{display:flex;align-items:center;gap:3px;font-family:var(--num);font-size:18px;font-weight:600;color:#4fd3e8;line-height:1}
.scard .cb{font-size:11px;color:var(--muted);font-weight:600;margin-top:auto}
.scard .lv{position:absolute;right:6px;top:5px;font-size:11px;font-weight:700;color:var(--ink)}
.scard.in{outline:3px solid var(--good);outline-offset:1px}
.scard.locked{opacity:.35;cursor:default}
.scard.ghost{border-style:dashed;background:transparent;align-items:center;justify-content:center;color:var(--muted);font-size:12px;cursor:default;border-color:var(--rule)}

.shoe-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--rc,var(--r0));border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;width:100%}
.shoe-row svg{width:56px;height:28px;flex:none}
.shoe-row .info{flex:1;min-width:0}
.shoe-row b{display:block;font-size:15px}
.shoe-row small{color:var(--muted);font-size:12px;font-weight:600}
.shoe-row .w{font-size:12px;color:var(--gold);font-weight:700;text-align:right}

.season{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.season b{font-family:var(--display);font-weight:400;font-size:17px}
.season .rec{font-family:var(--num);font-size:30px;font-weight:600;line-height:1}
.prog{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold)}
.next{border:2px solid var(--gold);background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.next .vs{display:flex;align-items:center;gap:10px}
.next .vs .crest{width:44px;height:48px}
.next .vs b{font-family:var(--display);font-weight:400;font-size:17px;display:block}
.next .vs small{color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.1em}
.ovrs{display:flex;gap:16px;font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.ovrs span b{font-family:var(--num);font-size:22px;color:var(--ink);font-weight:600;margin-left:4px}
.games{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.game{display:grid;grid-template-columns:40px 26px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--rule);font-size:14px}
.game:first-child{border-top:0}
.game .gn{color:var(--muted);font-weight:700;font-size:12px}
.game .crest{width:22px;height:24px}
.game .res{font-family:var(--num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.game .res.w{color:var(--good)} .game .res.l{color:var(--bad)}
.game.cur{background:var(--panel2)}
.game .up{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em}

.pack{border-radius:16px;padding:14px 14px 14px 10px;display:flex;gap:12px;align-items:stretch;border:1px solid var(--rule);background:var(--panel);position:relative;overflow:hidden}
.pack.pl{background:radial-gradient(120% 100% at 0% 40%,rgba(255,201,77,.2),transparent 55%),var(--panel)}
.pack.sh{background:radial-gradient(120% 100% at 0% 40%,rgba(79,211,232,.18),transparent 55%),var(--panel)}
.pack.sk{background:radial-gradient(120% 100% at 0% 40%,rgba(95,211,138,.18),transparent 55%),var(--panel)}
.pack-art{width:96px;flex:none;display:flex;align-items:center;justify-content:center;padding:4px 0}
.pack .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.pack h3{margin:0;font-family:var(--display);font-weight:400;font-size:17px}
.pack p{margin:0;font-size:13px;color:var(--muted);line-height:1.3}
.oddsrow{display:flex;flex-wrap:wrap;gap:4px}
.oc{font-size:11px;font-weight:700;border:1px solid var(--rc);color:var(--rc);border-radius:999px;padding:1px 7px;letter-spacing:.02em}
.buyrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.buy{display:flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:9px 13px;background:var(--gold);color:#2a1d00;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--gold-d)}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-d)}
.buy .ic{width:16px;height:16px}
.buy.no{background:var(--panel2);color:var(--muted);box-shadow:none;cursor:default}
.odds{font-size:12px;color:var(--muted);text-align:center;margin:0}

.foil{--fa:#ffe08a;--fb:#e2453a;--fc:#5a2a9a;position:relative;width:84px;aspect-ratio:.64;flex:none;border-radius:3px;overflow:hidden;
  background:linear-gradient(160deg,var(--fa),var(--fb) 52%,var(--fc));color:#fff;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 4px;transform:rotate(-5deg);
  box-shadow:0 12px 22px -8px rgba(0,0,0,.7),inset 0 0 0 1.5px rgba(255,255,255,.35);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) top/8px 51% repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) bottom/8px 51% repeat-x;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) top/8px 51% repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) bottom/8px 51% repeat-x}
.foil::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(118deg,transparent 0 7px,rgba(255,255,255,.13) 7px 8px),radial-gradient(130% 60% at 25% 8%,rgba(255,255,255,.5),transparent 60%),linear-gradient(0deg,rgba(0,0,0,.25),transparent 40%)}
.foil::after{content:"";position:absolute;top:-30%;bottom:-30%;left:-80%;width:60%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,50%{transform:translateX(0) skewX(-12deg)}100%{transform:translateX(420%) skewX(-12deg)}}
.foil > *{position:relative}
.foil .brand{font-family:var(--display);font-size:8px;letter-spacing:.06em;text-shadow:0 1px 0 rgba(0,0,0,.45);background:rgba(0,0,0,.28);padding:1px 4px;border-radius:2px}
.foil svg{width:50%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.foil .ptype{font-family:var(--display);font-size:10px;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.foil .pnote{font-size:9px;font-weight:700;letter-spacing:.1em;background:rgba(0,0,0,.32);border-radius:3px;padding:1px 5px}
.foil.shoe{--fa:#d9fbff;--fb:#3d8bfd;--fc:#141a52}
.foil.skill{--fa:#d8ffe5;--fb:#19a2b4;--fc:#10294a}
.foil.big{width:150px;transform:none;gap:9px;padding:20px 8px}
.foil.big .brand{font-size:13px} .foil.big .ptype{font-size:17px} .foil.big .pnote{font-size:12px}

.opening{position:relative;overflow:hidden;align-items:center;min-height:min(420px,85vh);justify-content:center}
.opening .rays{position:absolute;inset:-60%;pointer-events:none;opacity:.55;
  background:radial-gradient(circle,var(--glow) 0,transparent 32%),repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 9deg,transparent 9deg 18deg);animation:spin 14s linear infinite}
.opening .rays.hot{opacity:.9;animation-duration:6s}
@keyframes spin{to{transform:rotate(360deg)}}
.stagepack{position:relative;cursor:pointer;animation:packShake 1.3s ease-in both}
.stagepack .foil{box-shadow:0 0 40px -4px var(--glow),0 14px 30px -10px rgba(0,0,0,.8)}
@keyframes packShake{0%{transform:translateY(30px) scale(.8);opacity:0}18%{transform:none;opacity:1}40%{transform:rotate(-2deg)}48%{transform:rotate(2deg)}56%{transform:rotate(-3deg)}64%{transform:rotate(3deg)}72%{transform:rotate(-4deg) scale(1.03)}80%{transform:rotate(4deg) scale(1.05)}88%{transform:rotate(-5deg) scale(1.07)}100%{transform:rotate(0) scale(1.08)}}
.stagepack.burst{animation:packBurst .32s ease-out forwards}
@keyframes packBurst{to{transform:scale(1.6);opacity:0;filter:brightness(2.5)}}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none;animation:flash .5s ease-out forwards}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.ohead{position:relative;margin:0;font-family:var(--display);font-weight:400;font-size:22px;text-align:center;color:var(--glow);text-shadow:0 3px 0 rgba(0,0,0,.4)}

.reveal{position:relative;display:grid;gap:8px;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));width:100%}
.rcard{perspective:700px;aspect-ratio:.7;animation:dealIn .45s cubic-bezier(.2,1.3,.4,1) both;animation-delay:var(--d)}
@keyframes dealIn{from{transform:translateY(60px) scale(.5) rotate(-8deg);opacity:0}}
.rcard .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.rcard.flip .in{transform:rotateY(180deg)}
.rcard .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px;text-align:center;overflow:hidden}
.rcard .back{background:radial-gradient(circle at 50% 40%,#3a4290,#1c2146 70%);border:2px solid #4a52a0}
.rcard .back span{font-family:var(--display);font-size:11px;color:var(--gold);line-height:1;border:2px solid var(--gold);border-radius:50%;width:62%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.rcard .front{transform:rotateY(180deg);background:linear-gradient(165deg,var(--rca),var(--panel2) 58%);border:2px solid var(--rc);box-shadow:0 0 16px -3px var(--rc)}
.rcard.r3 .front{animation:legendGlow 1.4s ease-in-out infinite alternate}
@keyframes legendGlow{to{box-shadow:0 0 28px 2px var(--rc)}}
.rcard .ctop{position:absolute;left:6px;right:6px;top:5px;display:flex;justify-content:space-between;align-items:center}
.rcard .covr{font-family:var(--num);font-size:22px;font-weight:600;line-height:1}
.rcard .cpos{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.rcard .front svg.av{width:70%;max-width:78px;margin-top:10px}
.rcard .front svg.sh{width:82%;margin-top:10px}
.rcard .front b{font-size:12px;line-height:1.05}
.rcard .front b.cbig{font-family:var(--display);font-weight:400;font-size:13px;margin-top:8px}
.rcard .front .rr{font-size:10px;font-weight:700;color:var(--rc);letter-spacing:.08em;text-transform:uppercase}
.rcard .front .cstat{font-size:10px;color:var(--muted);font-weight:600;line-height:1.2}
.rcard .front .tg{font-size:10px;font-weight:700;background:var(--gold);color:#2a1d00;border-radius:4px;padding:1px 5px}
@media (prefers-reduced-motion:reduce){.foil::after,.opening .rays,.stagepack,.rcard,.rcard.r3 .front{animation:none}}

.locked-panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--muted);padding:20px}
.locked-panel svg{width:56px;height:56px;color:var(--muted)}
.locked-panel b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--ink)}

.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:5px}
.nav button{position:relative;border:0;background:transparent;border-radius:10px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.08em}
.nav button svg{width:24px;height:24px}
.nav button.on{background:var(--panel2);color:var(--ink)}
.nav button.on svg{color:var(--gold)}
.nav .lock{position:absolute;top:4px;right:calc(50% - 22px);width:15px!important;height:15px!important;color:var(--muted)}

.hud{display:flex;flex-direction:column;gap:7px}
.feedrow{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;min-height:18px;overflow:hidden;white-space:nowrap}
.feedrow i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.feedrow span{overflow:hidden;text-overflow:ellipsis}
#stamn{font-family:var(--num);font-size:19px;color:var(--ink);letter-spacing:0;min-width:3.4ch;text-align:right;font-weight:600;padding-top:2px}
.btn{flex:1;position:relative;border:0;border-radius:16px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;transition:transform .06s, box-shadow .06s, opacity .2s, filter .2s}
.btn .big{font-family:var(--display);font-size:21px;letter-spacing:.03em;line-height:1}
.btn .sub{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.pass{background:var(--gold);color:#2a1d00;box-shadow:0 5px 0 var(--gold-d)}
.shoot{background:var(--team);color:var(--team-ink);box-shadow:0 5px 0 var(--team-d)}
.btn.press,.btn:active{transform:translateY(4px);box-shadow:0 1px 0 transparent}
.btn.off{opacity:.35;filter:saturate(.2)}
.btn:focus-visible,.hcard:focus-visible,.nav button:focus-visible,.buy:focus-visible,.mbtn:focus-visible,.chip:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.modal{position:fixed;inset:0;z-index:30;background:rgba(8,9,20,.78);display:flex;align-items:flex-end;justify-content:center;padding:max(10px, env(safe-area-inset-top,0px)) max(10px, env(safe-area-inset-right,0px)) max(10px, env(safe-area-inset-bottom,0px)) max(10px, env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:480px;max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.ptop{display:flex;gap:12px;align-items:center}
.ptop svg.av{width:84px;height:84px;flex:none;border-radius:12px;background:var(--panel2);border:2px solid var(--rc)}
.ptop h2{margin:0;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.1}
.ptop .meta{color:var(--muted);font-size:14px;font-weight:600}
.ptop .rar{color:var(--rc);font-weight:700}
.bigovr{margin-left:auto;text-align:center;font-family:var(--num);font-size:44px;font-weight:600;line-height:.85}
.bigovr small{display:block;font-family:var(--label);font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.stars{color:var(--gold);font-size:18px;letter-spacing:2px}
.stars .off{color:var(--rule)}
.statl{display:grid;grid-template-columns:80px 1fr 56px;align-items:center;gap:8px;font-size:14px;font-weight:600}
.statl .bar{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;display:flex}
.statl .bar i{display:block;height:100%;background:var(--ink)}
.statl .bar i.b{background:var(--good)}
.statl span:last-child{font-family:var(--num);font-size:19px;text-align:right}
.statl em{font-style:normal;color:var(--good);font-size:14px;margin-left:2px}
.mbtn{border:0;border-radius:12px;padding:12px;font-weight:700;font-size:16px;letter-spacing:.06em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.mbtn.pri{background:var(--gold);color:#2a1d00}
.mbtn.sec{background:var(--panel2);color:var(--ink)}
.mbtn.no{background:var(--panel2);color:var(--muted);cursor:default}
.mrow{display:flex;gap:8px}
.mrow>*{flex:1}


.setup{position:fixed;inset:0;z-index:40;background:var(--arena);overflow-y:auto;display:flex;justify-content:center;padding:max(20px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(20px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.setup .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px}
.logo{font-family:var(--display);font-weight:400;font-size:42px;line-height:.95;text-align:center;margin:10px 0 0;color:var(--gold);text-shadow:0 4px 0 #7d1b14}
.logo small{display:block;font-family:var(--label);font-size:15px;letter-spacing:.2em;color:var(--muted);text-shadow:none;margin-top:8px;font-weight:700}
.field label{display:block;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-bottom:6px}
.field input{width:100%;font:inherit;font-size:20px;font-weight:700;padding:12px 14px;border-radius:12px;border:2px solid var(--rule);background:var(--panel);color:var(--ink);user-select:text;-webkit-user-select:text}
.field input:focus{outline:none;border-color:var(--gold)}
.frs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fr{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel);border:2px solid var(--rule);cursor:pointer;text-align:left}
.fr .crest{width:36px;height:40px}
.fr b{display:block;font-size:16px}
.fr small{color:var(--muted);font-weight:600;font-size:13px}
.fr.on{border-color:var(--gold);background:var(--panel2)}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:18px;margin:-6px 0 0}

#rotate{position:fixed;inset:0;z-index:60;background:var(--arena);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
#rotate h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--gold)}
#rotate p{margin:0;font-size:17px;color:var(--muted);font-weight:600}
#rotate .phone{width:34px;height:58px;border:4px solid var(--ink);border-radius:8px;animation:tilt 1.6s ease-in-out infinite}
@keyframes tilt{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
@media (orientation:landscape) and (max-height:520px){ #rotate{display:flex} }
@media (prefers-reduced-motion:reduce){ #rotate .phone{animation:none} }

/* ---- v3: training gym, cards, matchup, viewer ---- */
.gymtag{position:absolute;left:10px;top:10px;max-width:calc(100% - 20px);background:rgba(18,21,44,.82);border:1px solid var(--rule);border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--gold);cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gymtag span{color:var(--ink);letter-spacing:.02em;font-weight:600}
.autobtn{position:absolute;left:8px;top:8px;height:36px;border-radius:10px;border:1px solid var(--rule);background:rgba(18,21,44,.85);display:flex;align-items:center;gap:7px;padding:0 11px;font-weight:700;font-size:13px;letter-spacing:.1em;cursor:pointer}
.autobtn i{width:28px;height:16px;border-radius:999px;background:var(--rule);position:relative;transition:background .2s}
.autobtn i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--ink);transition:transform .2s}
.autobtn.on{border-color:var(--good);color:var(--good)}
.autobtn.on i{background:var(--good)} .autobtn.on i::after{transform:translateX(12px)}
.effbar{position:absolute;left:8px;top:50px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.effbar span{background:rgba(90,15,34,.85);border:1px solid #ff4d6a;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;letter-spacing:.08em}
.effbar b{font-family:var(--num);font-size:15px;font-weight:600}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--rule);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;z-index:6;pointer-events:none;max-width:calc(100% - 24px);text-align:center}

.stamrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.stam{position:relative;height:12px;border-radius:6px;background:var(--rule);overflow:hidden;
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(20% - 2px),rgba(10,12,30,.7) calc(20% - 2px) 20%)}
.stam i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#1a8fb0,#4fd3e8);transition:width .15s linear;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(20% - 2px),transparent calc(20% - 2px) 20%);mask:repeating-linear-gradient(90deg,#000 0 calc(20% - 2px),transparent calc(20% - 2px) 20%)}
#stamn{font-family:var(--num);font-size:19px;color:var(--ink);letter-spacing:0;min-width:3.6ch;text-align:right;font-weight:600;padding-top:2px}
.hand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.hcard{position:relative;border:0;padding:0;background:none;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;transition:transform .1s,opacity .15s,filter .15s;min-width:0}
.hcard.empty{border:1px dashed var(--rule);border-radius:9px;aspect-ratio:1.18}
.hcard.off{opacity:.5;filter:saturate(.35) brightness(.8)}
.hcard.poor .ccost{background:#5a0f22;color:#ffb3c0}
.hcard:active:not(.off){transform:translateY(-3px) scale(1.03)}
.hcard.fly{animation:fly .25s ease-out}
@keyframes fly{50%{transform:translateY(-10px) scale(1.08)}}
.handhint{margin:0;font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:4px;min-height:16px}

.cframe{position:relative;display:block;border-radius:9px;overflow:hidden;border:2px solid var(--rc);background:#0d0f22;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.cframe .art{display:block;width:100%;aspect-ratio:1.25;height:auto}
.cframe .ccost{position:absolute;left:3px;top:3px;display:flex;align-items:center;gap:1px;background:rgba(8,12,30,.85);color:#4fd3e8;border-radius:6px;padding:1px 5px 0 3px;font-family:var(--num);font-size:16px;font-weight:600;line-height:1.05}
.cframe .ctype{position:absolute;right:3px;top:4px;font-size:8px;font-weight:700;letter-spacing:.1em;background:rgba(0,0,0,.4);border-radius:4px;padding:1px 4px}
.cframe .clv{position:absolute;right:3px;top:18px;font-size:9px;font-weight:700;color:var(--gold);background:rgba(0,0,0,.45);border-radius:4px;padding:0 4px}
.cframe .cname{display:block;padding:3px 4px 4px;font-size:11px;font-weight:700;line-height:1.05;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent)}
.cframe.t-drb .cname{color:#c9c1ff} .cframe.t-sht .cname{color:#ffc39e} .cframe.t-pas .cname{color:#a6f0cf} .cframe.t-def .cname{color:#ffb3c0}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);cursor:pointer}
.fchip.on{border-color:var(--tc,var(--gold));color:var(--ink);background:var(--panel2)}
.deckhead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:8px 12px}
.deckhead b{font-family:var(--num);font-size:34px;font-weight:600;line-height:.9}
.deckhead > div:first-child span{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.1em;margin-left:3px}
.deckhead .mix{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11px;font-weight:700;letter-spacing:.06em}
.deckhead .mix span{color:var(--tc)}
.deckhead .avg{text-align:right;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.deckhead .avg b{display:block;font-size:24px;color:#4fd3e8}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:7px}
.dgrid.big{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.dcard{position:relative;border:0;padding:0;background:none;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.dcard .cnt{position:absolute;right:-3px;bottom:16px;background:var(--gold);color:#2a1d00;font-family:var(--num);font-size:16px;font-weight:600;border-radius:999px;padding:1px 6px 0;line-height:1.1}
.dcard .own{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.dcard .desc{font-size:11px;color:var(--muted);line-height:1.2}
.dcard.full .cframe{opacity:.55}
.dcard.locked{opacity:.32;cursor:default}

.chip .tag.gy{background:var(--good);color:#06301a}
.chip.maxed{opacity:.55}
.station{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.shead{display:flex;align-items:center;gap:10px}
.shead > div{flex:1;min-width:0}
.shead b{display:block;font-size:16px}
.shead small{color:var(--muted);font-size:12px;font-weight:600}
.sic{width:36px;height:36px;flex:none;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.sic svg{width:22px;height:22px}
.slv{color:var(--gold);font-size:13px;letter-spacing:1px;white-space:nowrap}
.slv i{font-style:normal;color:var(--rule)}
.trainee{display:flex;align-items:center;gap:9px;border:0;background:var(--panel2);border-radius:10px;padding:5px 8px;cursor:pointer;text-align:left;width:100%}
.trainee svg.av{width:40px;height:40px;border-radius:8px;flex:none}
.trainee b{display:block;font-size:14px}
.trainee small{color:var(--good);font-size:12px;font-weight:700}
.shop{display:flex;flex-direction:column;gap:6px}
.buyst{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:7px 10px;cursor:pointer;text-align:left}
.buyst > span:nth-child(2){flex:1;min-width:0}
.buyst b{display:block;font-size:15px}
.buyst small{color:var(--muted);font-size:12px;font-weight:600}
.buyst .pr{display:flex;align-items:center;gap:4px;font-family:var(--num);font-size:18px;font-weight:600;color:var(--gold)}
.buyst.no{opacity:.45;cursor:default}

.pcard{padding-top:0;gap:10px}
.vstage{position:relative;margin:0 -14px;height:min(46vh,330px);min-height:240px;background:radial-gradient(70% 60% at 50% 45%,var(--rc),transparent 72%),radial-gradient(120% 100% at 50% 0%,#2a3170,#12152c);border-radius:18px 18px 0 0;overflow:hidden;flex:none}
.vstage::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 45%,transparent 40%,rgba(18,21,44,.55));pointer-events:none}
.vcanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;z-index:1}
.vfallback{position:absolute;inset:18% 25% 18%;display:flex;align-items:center;justify-content:center}
.vstage.live .vfallback{display:none}
.vbadge{position:absolute;left:14px;top:12px;z-index:2;text-align:center;line-height:.9}
.vbadge b{display:block;font-family:var(--num);font-size:46px;font-weight:600;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.vbadge span{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.vname{position:absolute;right:14px;top:14px;z-index:2;text-align:right;max-width:60%}
.vname h2{margin:2px 0;font-family:var(--display);font-weight:400;font-size:18px;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.vname .rar{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--rc)}
.vposes{position:absolute;left:0;right:0;bottom:10px;z-index:2;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 8px}
.vposes .fchip{background:rgba(18,21,44,.8)}
.vhint{position:absolute;right:12px;bottom:46px;z-index:2;margin:0;font-size:11px;color:var(--muted);font-weight:600;pointer-events:none}
.statsrc{font-size:11px;color:var(--good);font-weight:700;margin:-6px 0 0 88px;min-height:0}
.statsrc:empty{display:none}

.matchup{position:absolute;inset:0;z-index:4;background:linear-gradient(90deg,rgba(18,21,44,.96),rgba(18,21,44,.9) 50%,rgba(18,21,44,.96));display:grid;grid-template-columns:1fr 34px 1fr;grid-template-rows:1fr auto;gap:6px;padding:10px 8px;overflow-y:auto}
.mside{display:flex;flex-direction:column;gap:5px;min-width:0;animation:slideL .45s cubic-bezier(.2,1.2,.4,1) both}
.mside.away{animation-name:slideR}
@keyframes slideL{from{transform:translateX(-40px);opacity:0}} @keyframes slideR{from{transform:translateX(40px);opacity:0}}
.mhead{display:flex;align-items:center;gap:6px;border-bottom:3px solid var(--tc);padding-bottom:5px;min-width:0}
.mhead .crest{width:26px;height:29px}
.mhead b{display:block;font-family:var(--display);font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mhead span{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.mhead > div{min-width:0}
.mcard{position:relative;display:grid;grid-template-columns:42px 1fr;grid-template-rows:auto auto;align-items:center;column-gap:6px;background:var(--panel);border:2px solid var(--rc);border-radius:9px;padding:3px 6px 3px 3px;animation:pop .4s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--d)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.mcard svg.av{grid-row:span 2;width:42px;height:42px;border-radius:6px}
.mcard .mo{font-family:var(--num);font-size:22px;font-weight:600;line-height:1}
.mcard .mp{position:absolute;right:6px;top:4px;font-size:10px;font-weight:700;color:var(--muted)}
.mcard b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mvs{display:flex;align-items:center;justify-content:center}
.mvs b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--gold);text-shadow:0 3px 0 #7d1b14}
.mfoot{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;align-items:center}
.mfoot .mbtn{min-width:220px}
.leaders{display:flex;gap:18px;justify-content:center;font-weight:700;font-size:15px}
.leaders span{display:flex;flex-direction:column;align-items:center}
.leaders small{font-size:10px;color:var(--muted);letter-spacing:.12em}
.rcard.skill .front{padding:4px;justify-content:flex-start}
.rcard .cardfill{width:100%}
.rcard .cardfill .cframe .cname{white-space:normal;font-size:10px}
.overlay{z-index:5}
@media (prefers-reduced-motion:reduce){.mside,.mcard,.hcard.fly{animation:none}}

.pre .hud{display:none}
.chip svg.av{border-radius:7px}

/* ---- v4: banners, settings, gym ---- */
.gear{width:34px;height:34px;flex:none;border-radius:999px;border:1px solid var(--rule);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.gear svg{width:18px;height:18px}
.fpsbox{position:absolute;right:8px;bottom:8px;z-index:3;background:rgba(0,0,0,.6);border-radius:6px;padding:2px 7px;font-family:var(--num);font-size:16px;color:#5fd38a;pointer-events:none}
.home .fpsbox{bottom:8px}
.banner-card{border-radius:16px;overflow:hidden;border:1px solid var(--rule);background:var(--panel);display:flex;flex-direction:column}
.bart{position:relative;height:150px;overflow:hidden;display:flex;align-items:flex-end}
.bart.feat{background:radial-gradient(90% 120% at 75% 30%,#ffe08a,#e2453a 45%,#3a0f4a 85%)}
.bart.std{background:radial-gradient(90% 120% at 50% 20%,#7c6bff,#2a1d7a 60%,#12152c)}
.bart.street{background:repeating-linear-gradient(135deg,#1f242f 0 14px,#262c39 14px 28px)}
.bart.feat svg.av{position:absolute;right:-6px;bottom:-10px;width:170px;height:170px;-webkit-mask:radial-gradient(70% 70% at 50% 45%,#000 60%,transparent 75%);mask:radial-gradient(70% 70% at 50% 45%,#000 60%,transparent 75%)}

const KEY = 'dreamball-save-v3', OLD_KEY = 'dreamball-save-v2';

  try {

      for (const id in o.cards || {}) { if (!CARD[id]) continue; const add = LV_AT[o.cards[id].lv || 1] + (o.cards[id].cp || 0); cards[id] = {n:(cards[id] ? cards[id].n : 0) + add}; }
      const s3 = Object.assign({}, o, {v:3, cards, deck:starterDeck(cards), gym:null});

}
function fixSave(s) {

}

  }
  else if (a === 'deckclear') { S.deck = []; save(); renderTop(); renderPanel(); }
  else if (a === 'starup') {

  }
  else if (a === 'shoes') { sheetShoes = true; renderPlayer(); }

  else if (a === 'unequip') { S.owned[sheetId].shoe = null; sheetShoes = false; save(); renderTop(); renderPlayer(); renderPanel(); }
  else if (a === 'vpose') { VW.anim = d.k; if (VW.a) VW.a.t = 0; document.querySelectorAll('.vposes .fchip').forEach(b => b.classList.toggle('on', b.dataset.k === d.k)); }
  else if (a === 'mclose') closeModal();
  else if (a === 'settings') openSettings();

  else if (a === 'create') createTeam();
  else if (a === 'pause') { if (G.game && !G.done) { G.paused = true; $('pause').hidden = false; } }
  else if (a === 'resume') { G.paused = false; $('pause').hidden = true; }

  }

  }
}
document.addEventListener('click', e => { const el = e.target.closest && e.target.closest('[data-act]'); if (el) act(el.dataset.act, el.dataset); });

});

// ================= boot =================

catch (err) { renderer = null; const d = document.createElement('div'); d.className = 'glfail'; d.textContent = 'This device could not start the 3D view. Try an up-to-date browser.'; wrap.appendChild(d); }

}

});

$('fpsbox').hidden = !SET.showFps;
function frame(now) {
  requestAnimationFrame(frame);
  const interval = SET.fps >= 120 ? 0 : 1000 / SET.fps;
  if (interval && now - lastDraw < interval - 2) return;
  lastDraw = now;
  const dt = Math.min(.05, (now - last) / 1000); last = now; CLK += dt;
  fpsN++; fpsT += dt; if (fpsT >= .5) { if (SET.showFps) $('fpsbox').textContent = Math.round(fpsN / fpsT) + ' FPS'; fpsN = 0; fpsT = 0; }

})();
